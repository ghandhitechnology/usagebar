[package]
name = "usagebar"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
# PKCE: a random verifier, and the SHA-256 the S256 challenge is built from.
getrandom = "0.3"
sha2 = "0.10"

[profile.release]
opt-level = 3
strip = true
lto = true
