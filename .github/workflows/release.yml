name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: usagebar-linux-x86_64.tar.gz
            binary: usagebar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: usagebar-linux-aarch64.tar.gz
            binary: usagebar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: usagebar-macos-x86_64.tar.gz
            binary: usagebar
          - os: macos-14
            target: aarch64-apple-darwin
            archive: usagebar-macos-aarch64.tar.gz
            binary: usagebar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: usagebar-windows-x86_64.tar.gz
            binary: usagebar.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: tar -C "target/${{ matrix.target }}/release" -czf "${{ matrix.archive }}" "${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: usagebar-*.tar.gz
